<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狼人杀 - 联机版</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

  :root {
    --bg-deep: #0a0a14;
    --bg-card: #141428;
    --purple: #6c3ce0;
    --purple-glow: #8b5cf6;
    --gold: #d4a843;
    --gold-glow: #f0c96d;
    --red: #e04040;
    --red-glow: #ff6b6b;
    --green: #3cb878;
    --green-glow: #5ddb9e;
    --blue: #4a90d9;
    --blue-glow: #6db3f0;
    --text: #c8c8d8;
    --text-bright: #e8e8f0;
    --text-dim: #8888a0;
    --border: #2a2a45;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'ZCOOL XiaoWei', 'PingFang SC', 'Microsoft YaHei', serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .stars-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .moon {
    position: fixed; top: 40px; right: 80px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9b0 0%, #f0c96d 30%, #c89540 70%, transparent 100%);
    box-shadow: 0 0 80px rgba(240,201,109,0.4), 0 0 160px rgba(240,201,109,0.15);
    pointer-events: none; z-index: 0;
    animation: moonGlow 4s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%,100% { box-shadow: 0 0 80px rgba(240,201,109,0.4), 0 0 160px rgba(240,201,109,0.15); }
    50% { box-shadow: 0 0 100px rgba(240,201,109,0.5), 0 0 200px rgba(240,201,109,0.2); }
  }

  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 860px;
    padding: 24px; min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .header { text-align: center; padding: 20px 0 12px; }
  .header h1 {
    font-family: 'Ma Shan Zheng', 'STKaiti', cursive;
    font-size: 52px;
    background: linear-gradient(135deg, var(--gold) 0%, #e8c870 40%, #b89330 70%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(212,168,67,0.3));
    letter-spacing: 8px; line-height: 1.2;
  }
  .header .subtitle { font-size: 14px; color: var(--text-dim); letter-spacing: 6px; margin-top: 4px; }

  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px;
    box-shadow: var(--shadow); transition: all 0.3s ease;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 28px; border: none; border-radius: 28px;
    font-family: inherit; font-size: 15px; cursor: pointer;
    transition: all 0.3s ease; letter-spacing: 2px;
    position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--purple) 0%, #7b52e0 100%);
    color: #fff; box-shadow: 0 4px 16px rgba(108,60,224,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 24px rgba(108,60,224,0.5); transform: translateY(-1px); }
  .btn-gold {
    background: linear-gradient(135deg, #b89330 0%, var(--gold) 100%);
    color: #1a1a00; font-weight: bold; box-shadow: 0 4px 16px rgba(212,168,67,0.3);
  }
  .btn-gold:hover { box-shadow: 0 6px 24px rgba(212,168,67,0.5); transform: translateY(-1px); }
  .btn-danger {
    background: linear-gradient(135deg, #c0392b 0%, var(--red) 100%);
    color: #fff; box-shadow: 0 4px 16px rgba(224,64,64,0.3);
  }
  .btn-danger:hover { box-shadow: 0 6px 24px rgba(224,64,64,0.5); transform: translateY(-1px); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text-bright); }
  .btn-sm { padding: 8px 18px; font-size: 13px; letter-spacing: 1px; }
  .btn-xs { padding: 5px 12px; font-size: 12px; border-radius: 20px; letter-spacing: 1px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .btn-lg { padding: 14px 40px; font-size: 17px; }

  .input {
    width: 100%; padding: 12px 18px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text-bright);
    font-family: inherit; font-size: 15px; outline: none; transition: all 0.3s ease;
  }
  .input:focus { border-color: var(--purple-glow); box-shadow: 0 0 0 3px rgba(108,60,224,0.1); }
  .input::placeholder { color: var(--text-dim); }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .player-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.3s ease; position: relative;
  }
  .player-chip:hover {
    background: rgba(255,255,255,0.06); border-color: var(--purple-glow);
    transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108,60,224,0.15);
  }
  .player-chip.selected {
    border-color: var(--gold); background: rgba(212,168,67,0.1);
    box-shadow: 0 0 16px rgba(212,168,67,0.2);
  }
  .player-chip.voted-by-me {
    border-color: var(--red-glow); background: rgba(224,64,64,0.12);
    box-shadow: 0 0 14px rgba(224,64,64,0.2);
  }
  .player-chip.dead {
    opacity: 0.4; pointer-events: none;
    text-decoration: line-through; text-decoration-color: var(--red);
  }
  .player-chip .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .player-chip .avatar.male { background: linear-gradient(135deg, #3a5a8c, #4a90d9); }
  .player-chip .avatar.female { background: linear-gradient(135deg, #8c3a5a, #d94a90); }
  .player-chip .info { flex: 1; min-width: 0; }
  .player-chip .name { font-size: 14px; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-chip .number { font-size: 11px; color: var(--text-dim); }

  .role-reveal { text-align: center; padding: 40px 20px; }
  .role-icon {
    width: 100px; height: 100px; border-radius: 50%;
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    font-size: 52px; animation: roleReveal 0.8s ease-out;
  }
  @keyframes roleReveal {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .role-icon.werewolf { background: linear-gradient(135deg, #4a1010, #8b2020); box-shadow: 0 0 40px rgba(224,64,64,0.4); }
  .role-icon.villager { background: linear-gradient(135deg, #2a3a2a, #3a5a3a); box-shadow: 0 0 30px rgba(60,180,120,0.2); }
  .role-icon.seer { background: linear-gradient(135deg, #1a2a4a, #2a4a8a); box-shadow: 0 0 40px rgba(74,144,217,0.4); }
  .role-icon.witch { background: linear-gradient(135deg, #3a1a4a, #6a2a8a); box-shadow: 0 0 40px rgba(160,80,220,0.4); }
  .role-icon.hunter { background: linear-gradient(135deg, #4a3a1a, #8a6a2a); box-shadow: 0 0 40px rgba(212,168,67,0.4); }
  .role-icon.guard { background: linear-gradient(135deg, #1a3a3a, #2a6a6a); box-shadow: 0 0 40px rgba(60,200,180,0.4); }
  .role-name { font-family: 'Ma Shan Zheng', 'STKaiti', cursive; font-size: 36px; margin-bottom: 8px; }
  .role-desc { font-size: 14px; color: var(--text-dim); max-width: 300px; margin: 0 auto; }

  .log-area { max-height: 200px; overflow-y: auto; padding: 4px 0; }
  .log-entry {
    padding: 8px 14px; margin: 4px 0; border-radius: 8px;
    font-size: 13px; animation: logSlide 0.4s ease-out;
  }
  @keyframes logSlide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  .log-entry.system { background: rgba(108,60,224,0.1); border-left: 3px solid var(--purple); }
  .log-entry.kill { background: rgba(224,64,64,0.1); border-left: 3px solid var(--red); }
  .log-entry.save { background: rgba(60,184,120,0.1); border-left: 3px solid var(--green); }
  .log-entry.check { background: rgba(74,144,217,0.1); border-left: 3px solid var(--blue); }
  .log-entry.vote { background: rgba(212,168,67,0.1); border-left: 3px solid var(--gold); }
  .log-entry.info { background: rgba(160,80,220,0.1); border-left: 3px solid #a050dc; }

  .phase-badge {
    display: inline-block; padding: 6px 16px; border-radius: 16px;
    font-size: 12px; letter-spacing: 2px; margin-bottom: 8px;
  }
  .phase-badge.night { background: rgba(74,80,180,0.3); color: #8b9cf5; }
  .phase-badge.day { background: rgba(212,168,67,0.2); color: var(--gold); }

  .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-20 { margin-top: 20px; }
  .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-20 { margin-bottom: 20px; }
  .text-center { text-align: center; }
  .text-dim { color: var(--text-dim); font-size: 13px; }

  .highlight-box {
    padding: 16px 20px; border-radius: var(--radius-sm);
    text-align: center; margin-bottom: 16px;
  }
  .highlight-box.danger { background: rgba(224,64,64,0.08); border: 1px solid rgba(224,64,64,0.2); }
  .highlight-box.success { background: rgba(60,184,120,0.08); border: 1px solid rgba(60,184,120,0.2); }
  .highlight-box.info { background: rgba(74,144,217,0.08); border: 1px solid rgba(74,144,217,0.2); }

  .turn-indicator {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(108,60,224,0.15); border: 1px solid rgba(108,60,224,0.3);
    margin-bottom: 16px; font-size: 14px;
  }

  .vote-summary-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    font-size: 13px;
  }
  .vote-summary-row .bar {
    height: 20px; border-radius: 10px; transition: width 0.5s ease;
    background: linear-gradient(90deg, var(--red), var(--red-glow));
    min-width: 4px;
  }

  .result-banner { text-align: center; padding: 40px 20px; }
  .result-banner .trophy { font-size: 72px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .result-banner .verdict { font-family: 'Ma Shan Zheng', 'STKaiti', cursive; font-size: 38px; margin: 12px 0; }
  .result-banner .verdict.win { color: var(--gold); }
  .result-banner .verdict.lose { color: var(--red); }

  .room-code {
    font-family: monospace;
    font-size: 28px;
    letter-spacing: 8px;
    color: var(--gold);
    background: rgba(212,168,67,0.1);
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--gold);
    display: inline-block;
    margin: 8px 0;
  }

  .chat-box {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .chat-msg { font-size: 13px; margin: 4px 0; }
  .chat-msg .sender { color: var(--red-glow); font-weight: bold; }

  .timer {
    font-size: 24px;
    color: var(--red);
    font-family: monospace;
    text-align: center;
    margin-bottom: 12px;
  }

  .tab-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .tab-btn {
    background: transparent; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 14px; cursor: pointer; padding: 6px 12px;
  }
  .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

  @media (max-width: 600px) {
    .header h1 { font-size: 36px; letter-spacing: 4px; }
    .player-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .card { padding: 16px; }
    .moon { width: 60px; height: 60px; top: 16px; right: 16px; }
  }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 12px 24px; border-radius: var(--radius-sm);
    z-index: 100; animation: toastSlide 0.3s ease;
  }
  @keyframes toastSlide { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin-left:4px; }
  .badge-host { background: var(--gold); color: #1a1a00; }
  .badge-me { background: var(--purple); color: #fff; }
  .badge-dead { background: var(--red); color: #fff; }
</style>
</head>
<body>

<canvas class="stars-canvas" id="starsCanvas"></canvas>
<div class="moon"></div>
<div class="app" id="app"></div>

<script>
/* ========== 星空背景 ========== */
const canvas = document.getElementById('starsCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 2000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5, twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
    });
  }
}
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    s.twinkle += s.speed;
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.35 + 0.35;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,255,${alpha})`; ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
initStars(); drawStars();

/* ========== 音效 ========== */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration, type = 'sine', vol = 0.06) {
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator(); const gain = ac.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + duration);
  } catch(e) {}
}

/* ========== 角色定义 ========== */
const ROLES = {
  werewolf: { name: '狼人', icon: '🐺', color: '#e04040', desc: '每晚与其他狼人一起猎杀一名玩家', team: 'werewolf' },
  villager: { name: '村民', icon: '👨‍🌾', color: '#3cb878', desc: '没有特殊能力，通过推理找出狼人', team: 'villager' },
  seer:     { name: '预言家', icon: '🔮', color: '#4a90d9', desc: '每晚可以查验一名玩家的身份', team: 'villager' },
  witch:    { name: '女巫', icon: '🧪', color: '#a050dc', desc: '拥有一瓶解药和一瓶毒药，各可使用一次', team: 'villager' },
  hunter:   { name: '猎人', icon: '🏹', color: '#d4a843', desc: '被淘汰时可以开枪带走一名玩家', team: 'villager' },
  guard:    { name: '守卫', icon: '🛡️', color: '#3cc8b4', desc: '每晚可以守护一名玩家，不能连续守护同一人', team: 'villager' },
};

/* ========== Socket ========== */
const socket = io();
let state = null;
let personal = null;
let myName = localStorage.getItem('ww_name') || '';
let wwChatHistory = [];

socket.on('state', (s) => {
  if (s.phase === 'lobby' || s.phase === 'role-reveal') wwChatHistory = [];
  state = s;
  render();
});
socket.on('personal', (p) => { personal = p; render(); });
socket.on('ww-chat', (msg) => {
  wwChatHistory.push(msg);
  if (wwChatHistory.length > 50) wwChatHistory.shift();
  addWwChat(msg);
});
socket.on('vote-tick', (timeLeft) => {
  if (state) state.voteTimeLeft = timeLeft;
  updateVoteTimer(timeLeft);
});
socket.on('error-msg', (msg) => {
  showToast(msg);
});
socket.on('connect', () => {
  showToast('已连接到服务器');
});
socket.on('disconnect', () => {
  showToast('与服务器断开连接，正在重连...');
});

function showToast(msg) {
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

const app = document.getElementById('app');

/* ========== 页面路由 ========== */
function render() {
  if (!state) {
    app.innerHTML = renderLobby();
    return;
  }

  switch (state.phase) {
    case 'lobby': app.innerHTML = renderLobby(); break;
    case 'role-reveal': app.innerHTML = renderRoleReveal(); break;
    case 'night-werewolf':
    case 'night-seer':
    case 'night-witch':
    case 'night-guard': app.innerHTML = renderNight(); break;
    case 'hunter-shoot': app.innerHTML = renderHunterShoot(); break;
    case 'day': app.innerHTML = renderDay(); break;
    case 'vote': app.innerHTML = renderVote(); break;
    case 'tally': app.innerHTML = renderTally(); break;
    case 'gameover': app.innerHTML = renderGameOver(); break;
    default: app.innerHTML = renderLobby();
  }
}

/* ========== 大厅 ========== */
function renderLobby() {
  const inRoom = state && state.roomId;
  if (!inRoom) {
    return `
      <div class="header">
        <h1>狼 人 杀</h1>
        <div class="subtitle">联机版 · THE WEREWOLF ONLINE</div>
      </div>
      <div class="card mb-20">
        <div class="text-center mb-20">
          <div style="font-size:15px;color:var(--text-dim);letter-spacing:2px;">请输入昵称</div>
        </div>
        <div class="flex-row mb-20" style="justify-content:center;">
          <input class="input" id="nameInput" placeholder="你的昵称" style="max-width:260px;" value="${escapeHtml(myName)}" autocomplete="off"
            onkeydown="if(event.key==='Enter')app.setName()">
          <button class="btn btn-primary" onclick="app.setName()">确认</button>
        </div>
      </div>
    `;
  }

  const isHost = state.hostSocketId === personal?.mySocketId;
  const canStart = state.players.length >= 6 && isHost;

  return `
    <div class="header">
      <h1>狼 人 杀</h1>
      <div class="subtitle">房间等待中</div>
    </div>
    <div class="card mb-20">
      <div class="text-center mb-12">
        <div style="font-size:14px;color:var(--text-dim);">房间号</div>
        <div class="room-code">${state.roomId}</div>
        <div class="text-dim">分享给好友加入</div>
      </div>

      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">玩家列表 (${state.players.length}人)</div>
      <div class="player-grid mb-20">
        ${state.players.map(p => `
          <div class="player-chip">
            <div class="avatar ${p.gender}">👤</div>
            <div class="info">
              <div class="name">${escapeHtml(p.name)} ${p.socketId === state.hostSocketId ? '<span class="badge badge-host">房主</span>' : ''} ${p.socketId === personal?.mySocketId ? '<span class="badge badge-me">我</span>' : ''}</div>
              <div class="number">${p.disconnected ? '<span style="color:var(--red)">已离线</span>' : '在线'}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="flex-row" style="justify-content:center;">
        <button class="btn btn-gold btn-lg" ${!canStart ? 'disabled' : ''} onclick="app.startGame()">🌕 开始游戏</button>
      </div>
      ${!isHost ? '<div class="text-center text-dim mt-8">等待房主开始游戏...</div>' : ''}
      ${state.players.length < 6 ? `<div class="text-center text-dim mt-8">还需 ${6 - state.players.length} 名玩家</div>` : ''}
    </div>

    <div class="text-center">
      <button class="btn btn-ghost btn-sm" onclick="app.leaveRoom()">离开房间</button>
      <button class="btn btn-ghost btn-sm" onclick="app.showRules()">📖 游戏规则</button>
    </div>
  `;
}

/* ========== 角色揭示 ========== */
function renderRoleReveal() {
  if (!personal || !personal.myRoleInfo) return `<div class="text-center" style="padding:60px;">加载中...</div>`;
  const r = personal.myRoleInfo;
  const revealed = state.players.find(p => p.socketId === personal.mySocketId)?.revealed;

  if (revealed) {
    return `
      <div class="header"><h1 style="font-size:36px;">等待其他玩家</h1></div>
      <div class="card text-center" style="padding:60px;">
        <div style="font-size:56px;margin-bottom:16px;">⏳</div>
        <div class="text-dim">你已查看身份，请等待其他玩家...</div>
      </div>
    `;
  }

  return `
    <div class="header"><h1 style="font-size:36px;">查看身份</h1></div>
    <div class="card">
      <div class="role-reveal">
        <div class="role-icon ${personal.myRole}" style="box-shadow: 0 0 40px ${r.color}66;">${r.icon}</div>
        <div class="role-name" style="color:${r.color}">${r.name}</div>
        <div class="role-desc">${r.desc}</div>
      </div>
      ${personal.myRole === 'werewolf' && r.teammates?.length ? `
        <div class="highlight-box info mt-12">
          <div style="color:var(--red);font-size:13px;">🐺 你的狼人同伴：</div>
          <div style="color:var(--text-bright);margin-top:4px;">
            ${r.teammates.map(t => `${escapeHtml(t.name)} ${t.alive ? '' : '(已出局)'}`).join('、')}
          </div>
        </div>
      ` : ''}
      <div class="text-center mt-20">
        <button class="btn btn-primary" onclick="app.confirmReveal()">我已记住 🤫</button>
      </div>
    </div>
  `;
}

/* ========== 夜晚 ========== */
function renderNight() {
  const phase = state.phase;
  const alive = state.players.filter(p => p.alive && !p.disconnected);
  const myAlive = state.players.find(p => p.socketId === personal?.mySocketId)?.alive;

  let actionHtml = '';
  let title = '';
  let subtitle = '';

  const canAct = personal?.canAct;

  if (phase === 'night-werewolf') {
    title = '狼人行动';
    subtitle = '选择今夜猎杀目标';
    const teammateIds = new Set((personal?.myRoleInfo?.teammates || []).map(t => t.socketId));
    teammateIds.add(personal?.mySocketId);
    const targets = alive.filter(p => !teammateIds.has(p.socketId));
    const votedTarget = personal?.myWwVote;
    const aliveWolves = state.teamCounts?.werewolves || 0;
    const totalWwVotes = Object.values(state.wwVoteTally || {}).reduce((a,b)=>a+b, 0);
    const allWwVoted = totalWwVotes >= aliveWolves;

    if (canAct) {
      actionHtml = `
        <div class="card mb-20">
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">选择猎杀目标：</div>
          <div class="player-grid">
            ${targets.map(p => renderPlayerChip(p, {
              selectable: true,
              selected: votedTarget === p.socketId,
              onClick: `app.wwVote('${p.socketId}')`
            }))}
          </div>
          ${votedTarget ? `
            <div class="mt-12 text-center">
              <span style="color:var(--red-glow);">已提议猎杀：${escapeHtml(state.players.find(pl=>pl.socketId===votedTarget)?.name)}</span>
            </div>
          ` : ''}
          ${allWwVoted ? `
            <div class="flex-row mt-20" style="justify-content:center;">
              <button class="btn btn-danger" onclick="app.wwConfirmKill('${votedTarget}')">确认猎杀</button>
            </div>
          ` : ''}
        </div>
        ${renderWwChat()}
      `;
    } else {
      actionHtml = `
        <div class="card mb-20 text-center" style="padding:40px;">
          <div class="text-dim">🌙 狼人正在商议...</div>
        </div>
      `;
    }
  } else if (phase === 'night-seer') {
    title = '预言家行动';
    subtitle = '选择一名玩家查验身份';
    const targets = alive.filter(p => p.socketId !== personal?.mySocketId);

    if (canAct) {
      if (personal?.mySeerCheck) {
        const target = state.players.find(p => p.socketId === personal.mySeerCheck.targetId);
        const isWolf = personal.mySeerCheck.result === 'werewolf';
        actionHtml = `
          <div class="card mb-20 text-center">
            <div style="font-size:14px;color:var(--blue);letter-spacing:2px;">🔮 查验结果</div>
            <div class="highlight-box info mt-12">
              <span style="color:var(--text-bright);">${escapeHtml(target?.name)}</span> 的身份是
              <strong style="color:${isWolf ? '#e04040' : '#3cb878'};font-size:18px;">${isWolf ? '狼人' : '好人'}</strong>
            </div>
          </div>
        `;
      } else {
        actionHtml = `
          <div class="card mb-20">
            <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">选择查验对象：</div>
            <div class="player-grid">
              ${targets.map(p => renderPlayerChip(p, { selectable: true, onClick: `app.seerCheck('${p.socketId}')` }))}
            </div>
          </div>
        `;
      }
    } else {
      actionHtml = `<div class="card mb-20 text-center" style="padding:40px;"><div class="text-dim">🔮 预言家正在查验...</div></div>`;
    }
  } else if (phase === 'night-witch') {
    title = '女巫行动';
    subtitle = '';
    const killedPlayer = state.nightKill ? state.players.find(p => p.socketId === state.nightKill) : null;

    if (canAct) {
      const aliveAll = state.players.filter(p => p.alive && !p.disconnected);
      actionHtml = `
        <div class="card mb-20">
          <div class="highlight-box danger mb-12">
            今夜 <strong style="color:var(--red-glow);">${killedPlayer ? escapeHtml(killedPlayer.name) : '无人'}</strong> 被狼人猎杀
            ${killedPlayer && killedPlayer.socketId === personal?.mySocketId ? '<br><span style="color:var(--red);">(就是你本人！)</span>' : ''}
          </div>

          <div class="flex-row" style="justify-content:center;">
            <button class="btn btn-sm"
              style="background:${!state.witchSaveUsed ? (app._witchSave ? 'rgba(60,184,120,0.35)' : 'rgba(60,184,120,0.2)') : 'rgba(255,255,255,0.03)'};border-color:${!state.witchSaveUsed ? 'var(--green)' : 'var(--border)'};color:${!state.witchSaveUsed ? 'var(--green)' : 'var(--text-dim)'};"
              ${state.witchSaveUsed || !killedPlayer ? 'disabled' : ''}
              onclick="app.witchSave()">
              🧪 ${state.witchSaveUsed ? '解药已用' : app._witchSave ? '✓ 使用解药救人' : '使用解药救人'}
            </button>

            <button class="btn btn-sm"
              style="background:${!state.witchPoisonUsed ? (app._poisonTarget ? 'rgba(224,64,64,0.35)' : 'rgba(224,64,64,0.2)') : 'rgba(255,255,255,0.03)'};border-color:${!state.witchPoisonUsed ? 'var(--red)' : 'var(--border)'};color:${!state.witchPoisonUsed ? 'var(--red)' : 'var(--text-dim)'};"
              ${state.witchPoisonUsed ? 'disabled' : ''}
              onclick="app.togglePoison()">
              ☠️ ${state.witchPoisonUsed ? '毒药已用' : app._poisonTarget ? `毒杀: ${escapeHtml(state.players.find(pl=>pl.socketId===app._poisonTarget)?.name || '')}` : '使用毒药'}
            </button>
          </div>

          ${app._poisonChoosing ? `
            <div style="margin-top:16px;">
              <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">选择毒杀目标：</div>
              <div class="player-grid">
                ${aliveAll.filter(p => p.socketId !== personal?.mySocketId).map(p => renderPlayerChip(p, {
                  selectable: true,
                  selected: app._poisonTarget === p.socketId,
                  onClick: `app.selectPoison('${p.socketId}')`
                }))}
              </div>
              <div class="flex-row mt-12" style="justify-content:center;">
                <button class="btn btn-ghost btn-sm" onclick="app.cancelPoison()">取消</button>
                <button class="btn btn-danger" ${!app._poisonTarget ? 'disabled' : ''} onclick="app.confirmWitch()">确认</button>
              </div>
            </div>
          ` : ''}
        </div>
        <div class="flex-row" style="justify-content:center;">
          <button class="btn btn-primary" onclick="app.confirmWitch()">确认完成</button>
        </div>
      `;
    } else {
      actionHtml = `<div class="card mb-20 text-center" style="padding:40px;"><div class="text-dim">🧪 女巫正在抉择...</div></div>`;
    }
  } else if (phase === 'night-guard') {
    title = '守卫行动';
    subtitle = '选择守护一名玩家';
    const targets = alive;

    if (canAct) {
      actionHtml = `
        <div class="card mb-20">
          ${state.lastGuardTarget ? `<div class="text-center text-dim mb-12">⚠️ 昨晚守护了 <strong>${escapeHtml(state.players.find(p=>p.socketId===state.lastGuardTarget)?.name)}</strong>，不能连续守护</div>` : ''}
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">选择守护目标：</div>
          <div class="player-grid">
            ${targets.map(p => renderPlayerChip(p, {
              selectable: p.socketId !== state.lastGuardTarget,
              selected: app._guardTarget === p.socketId,
              onClick: p.socketId !== state.lastGuardTarget ? `app.selectGuard('${p.socketId}')` : null
            }))}
          </div>
        </div>
        <div class="flex-row" style="justify-content:center;">
          <button class="btn btn-ghost btn-sm" onclick="app.guardAction(null)">跳过 (不守护)</button>
          <button class="btn btn-primary" ${!app._guardTarget ? 'disabled' : ''} onclick="app.guardAction('${app._guardTarget || ''}')">确认守护</button>
        </div>
      `;
    } else {
      actionHtml = `<div class="card mb-20 text-center" style="padding:40px;"><div class="text-dim">🛡️ 守卫正在守护...</div></div>`;
    }
  }

  return `
    <div class="header">
      <span class="phase-badge night">🌑 夜晚 · 第 ${state.round} 夜</span>
      <h1 style="font-size:36px;">${title}</h1>
      ${subtitle ? `<div class="subtitle">${subtitle}</div>` : ''}
    </div>
    ${!myAlive ? `
      <div class="highlight-box danger mb-20">
        <div>你已经出局，请观战</div>
      </div>
    ` : ''}
    ${actionHtml}
    ${renderLogs()}
  `;
}

function renderWwChat() {
  return `
    <div class="card mb-20">
      <div style="font-size:14px;color:var(--red);margin-bottom:8px;">🐺 狼人密聊</div>
      <div class="chat-box" id="wwChatBox">
        ${wwChatHistory.map(c => `<div class="chat-msg"><span class="sender">${escapeHtml(c.from)}:</span> ${escapeHtml(c.msg)}</div>`).join('')}
      </div>
      <div class="flex-row">
        <input class="input" id="wwChatInput" placeholder="输入消息..." style="flex:1;" autocomplete="off"
          onkeydown="if(event.key==='Enter')app.sendWwChat()">
        <button class="btn btn-danger btn-sm" onclick="app.sendWwChat()">发送</button>
      </div>
    </div>
  `;
}

function addWwChat(msg) {
  const box = document.getElementById('wwChatBox');
  if (!box) return;
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<span class="sender">${escapeHtml(msg.from)}:</span> ${escapeHtml(msg.msg)}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

/* ========== 猎人开枪 ========== */
function renderHunterShoot() {
  const canAct = personal?.canAct;
  const hunter = state.players.find(p => p.socketId === state.hunterPending);
  const alive = state.players.filter(p => p.alive && !p.disconnected);

  if (canAct) {
    return `
      <div class="header"><h1 style="font-size:36px;">🏹 猎人发动技能</h1></div>
      <div class="card mb-20">
        <div class="text-center mb-16">你被淘汰了，请选择是否开枪带走一名玩家</div>
        <div class="player-grid mb-16">
          ${alive.map(p => renderPlayerChip(p, {
            selectable: true,
            selected: app._hunterShot === p.socketId,
            onClick: `app.selectHunter('${p.socketId}')`
          }))}
        </div>
        <div class="flex-row" style="justify-content:center;">
          <button class="btn btn-ghost btn-sm" onclick="app.hunterShoot('skip')">不开枪</button>
          <button class="btn btn-danger" ${!app._hunterShot ? 'disabled' : ''} onclick="app.hunterShoot('${app._hunterShot || ''}')">确认开枪</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="header"><h1 style="font-size:36px;">🏹 猎人发动技能</h1></div>
    <div class="card mb-20 text-center" style="padding:40px;">
      <div class="text-dim">${escapeHtml(hunter?.name || '')} 正在决定是否开枪...</div>
    </div>
  `;
}

/* ========== 白天 ========== */
function renderDay() {
  const alive = state.players.filter(p => p.alive && !p.disconnected);
  const elimNames = state.eliminatedTonight
    .map(e => state.players.find(p => p.socketId === e.id)?.name)
    .filter(Boolean);
  const elimMsg = elimNames.length > 0 ? `昨夜 ${elimNames.join('、')} 死亡` : '昨夜是平安夜，无人死亡';
  const isHost = state.hostSocketId === personal?.mySocketId;

  return `
    <div class="header">
      <span class="phase-badge day">☀️ 白天 · 第 ${state.round} 天</span>
      <h1 style="font-size:36px;">天亮了</h1>
    </div>

    <div class="card mb-20">
      <div class="highlight-box ${elimNames.length > 0 ? 'danger' : 'success'}">
        <div style="font-size:15px;color:${elimNames.length > 0 ? 'var(--red-glow)' : 'var(--green-glow)'};">
          ${elimMsg}
        </div>
      </div>

      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">存活玩家 (${alive.length}人)：</div>
      <div class="player-grid mb-20">
        ${alive.map(p => renderPlayerChip(p))}
      </div>
      ${renderLogs()}
    </div>

    <div class="flex-row" style="justify-content:center;">
      ${isHost
        ? `<button class="btn btn-gold btn-lg" onclick="app.startVote()">🗳️ 进入投票阶段</button>`
        : `<div class="text-dim">等待房主开启投票...</div>`
      }
    </div>
  `;
}

/* ========== 投票 ========== */
function renderVote() {
  const alive = state.players.filter(p => p.alive && !p.disconnected);
  const myVote = state.votes[personal?.mySocketId];
  const votedCount = Object.keys(state.votes).length;
  const canAct = personal?.canAct;

  return `
    <div class="header">
      <span class="phase-badge day">☀️ 白天 · 第 ${state.round} 天</span>
      <h1 style="font-size:28px;">投票放逐</h1>
      <div class="subtitle">选择你认为的狼人</div>
    </div>

    <div class="timer" id="voteTimer">${formatTime(state.voteTimeLeft || 0)}</div>

    <div class="card mb-20">
      ${canAct ? `
        ${myVote ? `
          <div class="text-center mb-12">
            <span style="color:var(--red-glow);">已投票给：<strong>${escapeHtml(state.players.find(p=>p.socketId===myVote)?.name)}</strong></span>
          </div>
        ` : ''}
        <div class="player-grid">
          ${alive.filter(p => p.socketId !== personal?.mySocketId).map(p => renderPlayerChip(p, {
            selectable: !myVote,
            selected: myVote === p.socketId,
            votedByMe: myVote === p.socketId,
            onClick: !myVote ? `app.castVote('${p.socketId}')` : null
          }))}
        </div>
      ` : `
        <div class="text-center" style="padding:20px;">
          <div class="text-dim">你已经投过票了，等待其他玩家...</div>
        </div>
        <div class="player-grid">
          ${alive.map(p => renderPlayerChip(p))}
        </div>
      `}

      <div class="mt-12 text-center text-dim">
        已投票: ${votedCount}/${alive.length}
      </div>
    </div>
  `;
}

function updateVoteTimer(ms) {
  const el = document.getElementById('voteTimer');
  if (el) el.textContent = formatTime(ms);
}

function formatTime(ms) {
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

/* ========== 计票 ========== */
function renderTally() {
  const tally = state._voteTally || {};
  const eliminatedId = state._pendingElimination;
  const eliminated = state.players.find(p => p.socketId === eliminatedId);
  const maxVotes = tally[eliminatedId] || 0;
  const isHost = state.hostSocketId === personal?.mySocketId;

  return `
    <div class="header">
      <span class="phase-badge day">☀️ 白天 · 第 ${state.round} 天</span>
      <h1 style="font-size:28px;">投票结果</h1>
    </div>
    <div class="card mb-20">
      <div class="mb-16">
        ${Object.entries(tally).sort((a,b) => b[1] - a[1]).map(([pid, cnt]) => {
          const p = state.players.find(pl => pl.socketId === pid);
          if (!p) return '';
          return `
            <div class="vote-summary-row">
              <span style="width:70px;text-align:right;color:var(--text-bright);">${escapeHtml(p.name)}</span>
              <div class="bar" style="width:${Math.max(cnt * 30, 20)}px;"></div>
              <span style="color:var(--red-glow);font-weight:bold;">${cnt}票</span>
            </div>
          `;
        }).join('')}
      </div>

      ${eliminated ? `
        <div class="highlight-box danger mb-16">
          <span style="font-size:18px;color:var(--red-glow);">
            🗳️ ${escapeHtml(eliminated.name)} 被放逐 (${maxVotes}票)
          </span>
          ${eliminated.role === 'hunter' ? '<div class="mt-8" style="color:var(--gold);">🏹 猎人可以开枪！</div>' : ''}
        </div>
      ` : `
        <div class="highlight-box info mb-16">
          平票或无人得票，本轮无人被放逐
        </div>
      `}

      ${isHost
        ? `<div class="text-center"><button class="btn btn-primary" onclick="app.afterVoteResult()">继续</button></div>`
        : `<div class="text-center text-dim">等待房主继续...</div>`
      }
    </div>
  `;
}

/* ========== 游戏结束 ========== */
function renderGameOver() {
  const winner = state.winner;
  const isVillagerWin = winner === 'villager';

  return `
    <div class="header"><h1 style="font-size:36px;">游戏结束</h1></div>
    <div class="card mb-20">
      <div class="result-banner">
        <div class="trophy">${isVillagerWin ? '🏆' : '🐺'}</div>
        <div class="verdict ${isVillagerWin ? 'win' : 'lose'}">
          ${isVillagerWin ? '好人阵营获胜！' : '狼人阵营获胜！'}
        </div>
        <div style="color:var(--text-dim);margin-bottom:8px;">
          ${isVillagerWin ? '所有狼人已被消灭，村庄恢复和平 🕊️' : '狼人占领了村庄...黑暗降临 🌑'}
        </div>
        <div class="text-dim">共进行 ${state.round} 轮</div>
      </div>

      <div style="text-align:left;">
        <div style="font-size:14px;color:var(--text-bright);margin-bottom:12px;">身份揭晓：</div>
        ${state.players.map(p => {
          const role = ROLES[p.role];
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:6px 0;${!p.alive ? 'opacity:0.5;' : ''}">
              <span style="font-size:20px;">${role.icon}</span>
              <span style="color:var(--text-bright);flex:1;">${escapeHtml(p.name)}</span>
              <span style="color:${role.color};font-size:13px;">${role.name}</span>
              ${!p.alive ? '<span style="color:var(--red);font-size:12px;">💀</span>' : '<span style="color:var(--green);font-size:12px;">✨</span>'}
            </div>
          `;
        }).join('')}
      </div>

      ${state.hostSocketId === personal?.mySocketId
        ? `<div class="text-center mt-20"><button class="btn btn-primary btn-lg" onclick="app.restartGame()">再来一局 🔄</button></div>`
        : `<div class="text-center text-dim mt-20">等待房主开始下一局...</div>`
      }
    </div>
  `;
}

/* ========== 公共组件 ========== */
function renderPlayerChip(p, opts = {}) {
  const { selectable, selected, votedByMe, onClick } = opts;
  const cls = [
    'player-chip',
    !p.alive ? 'dead' : '',
    selected ? 'selected' : '',
    votedByMe ? 'voted-by-me' : '',
  ].filter(Boolean).join(' ');

  const avatarCls = `avatar ${p.gender}`;
  const emoji = p.role && (!p.alive || state.phase === 'gameover') ? ROLES[p.role].icon : (p.gender === 'male' ? '👤' : '👤');

  const onclick = onClick ? `onclick="${onClick}"` : '';

  return `
    <div class="${cls}" data-id="${p.socketId}" ${onclick}>
      <div class="${avatarCls}">${emoji}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)} ${p.socketId === state.hostSocketId ? '<span class="badge badge-host">房主</span>' : ''} ${p.socketId === personal?.mySocketId ? '<span class="badge badge-me">我</span>' : ''} ${!p.alive ? '💀' : ''}</div>
        <div class="number">${p.role && (!p.alive || state.phase === 'gameover') ? ROLES[p.role].name : '存活'}</div>
      </div>
    </div>
  `;
}

function renderLogs() {
  return `
    <div class="card">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">游戏记录</div>
      <div class="log-area">
        ${(state.logs || []).map(l => `<div class="log-entry ${l.type}">${escapeHtml(l.msg)}</div>`).join('')}
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
}

/* ========== 操作 ========== */
app.setName = function() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) return showToast('请输入昵称');
  myName = name;
  localStorage.setItem('ww_name', name);
  app.showMenu();
};

app.showMenu = function() {
  state = null;
  app.innerHTML = `
    <div class="header">
      <h1>狼 人 杀</h1>
      <div class="subtitle">欢迎，${escapeHtml(myName)}</div>
    </div>
    <div class="card mb-20 text-center" style="padding:40px;">
      <button class="btn btn-primary btn-lg mb-12" style="width:200px;" onclick="app.createRoom()">🏠 创建房间</button>
      <div style="margin:12px 0;color:var(--text-dim);">— 或 —</div>
      <div class="flex-row" style="justify-content:center;">
        <input class="input" id="joinRoomId" placeholder="输入房间号" style="max-width:160px;text-transform:uppercase;" autocomplete="off"
          onkeydown="if(event.key==='Enter')app.joinRoom()">
        <button class="btn btn-gold" onclick="app.joinRoom()">加入</button>
      </div>
    </div>
    <div class="text-center">
      <button class="btn btn-ghost btn-sm" onclick="app.resetName()">更换昵称</button>
      <button class="btn btn-ghost btn-sm" onclick="app.showRules()">📖 游戏规则</button>
    </div>
  `;
};

app.resetName = function() {
  myName = '';
  localStorage.removeItem('ww_name');
  render();
};

app.createRoom = function() {
  if (!myName) return showToast('请先设置昵称');
  socket.emit('create-room', myName, (res) => {
    if (res.success) {
      showToast('房间创建成功');
    } else {
      showToast(res.error || '创建失败');
    }
  });
};

app.joinRoom = function() {
  if (!myName) return showToast('请先设置昵称');
  const input = document.getElementById('joinRoomId');
  const roomId = input.value.trim().toUpperCase();
  if (!roomId) return showToast('请输入房间号');
  socket.emit('join-room', roomId, myName, (res) => {
    if (res.success) {
      showToast('加入成功');
    } else {
      showToast(res.error || '加入失败');
    }
  });
};

app.leaveRoom = function() {
  socket.disconnect();
  location.reload();
};

app.startGame = function() {
  socket.emit('start-game');
};

app.confirmReveal = function() {
  socket.emit('confirm-reveal');
  playTone(440, 0.15, 'sine');
};

app.wwVote = function(targetId) {
  socket.emit('ww-vote', targetId);
  playTone(330, 0.2, 'triangle');
};

app.wwConfirmKill = function(targetId) {
  socket.emit('ww-confirm-kill', targetId);
  playTone(280, 0.3, 'sawtooth');
};

app.sendWwChat = function() {
  const input = document.getElementById('wwChatInput');
  const msg = input.value.trim();
  if (!msg) return;
  socket.emit('ww-chat', msg);
  input.value = '';
};

app.seerCheck = function(targetId) {
  socket.emit('seer-check', targetId);
  playTone(520, 0.2, 'sine');
};

app._witchSave = false;
app._poisonTarget = null;
app._poisonChoosing = false;
app._guardTarget = null;
app._hunterShot = null;

app.witchSave = function() {
  app._witchSave = !app._witchSave;
  render();
};

app.togglePoison = function() {
  app._poisonChoosing = !app._poisonChoosing;
  if (!app._poisonChoosing) app._poisonTarget = null;
  render();
};

app.selectPoison = function(targetId) {
  app._poisonTarget = targetId;
  render();
};

app.cancelPoison = function() {
  app._poisonTarget = null;
  app._poisonChoosing = false;
  render();
};

app.confirmWitch = function() {
  const saveUsed = app._witchSave;
  const poisonTarget = app._poisonTarget || null;
  socket.emit('witch-action', { save: saveUsed, poisonTargetId: poisonTarget });
  app._witchSave = false;
  app._poisonTarget = null;
  app._poisonChoosing = false;
  playTone(400, 0.2, 'triangle');
};

app.selectGuard = function(targetId) {
  app._guardTarget = targetId;
  render();
};

app.guardAction = function(targetId) {
  socket.emit('guard-action', targetId);
  app._guardTarget = null;
  playTone(400, 0.2, 'sine');
};

app.selectHunter = function(targetId) {
  app._hunterShot = targetId;
  render();
};

app.hunterShoot = function(targetId) {
  socket.emit('hunter-shoot', targetId);
  app._hunterShot = null;
  playTone(300, 0.2, 'triangle');
};

app.startVote = function() {
  socket.emit('start-vote');
};

app.castVote = function(targetId) {
  socket.emit('cast-vote', targetId);
  playTone(440, 0.12, 'sine');
};

app.afterVoteResult = function() {
  socket.emit('after-vote-result');
};

app.restartGame = function() {
  socket.emit('restart-game');
};

app.showRules = function() {
  // 如果已经存在规则遮罩，则不重复创建
  if (document.querySelector('.overlay.rules-overlay')) return;

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="overlay rules-overlay" onclick="this.remove()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:540px;text-align:left;">
        <h2 style="text-align:center;">📖 游戏规则</h2>
        <div style="font-size:13px;line-height:2;color:var(--text-dim);">
          <p><strong style="color:var(--red);">🐺 狼人</strong> — 每晚猎杀一名玩家，白天伪装成村民</p>
          <p><strong style="color:var(--green);">👨‍🌾 村民</strong> — 无特殊能力，通过推理找出狼人</p>
          <p><strong style="color:var(--blue);">🔮 预言家</strong> — 每晚查验一名玩家的身份</p>
          <p><strong style="color:#a050dc;">🧪 女巫</strong> — 拥有一瓶解药和一瓶毒药，各限一次</p>
          <p><strong style="color:var(--gold);">🏹 猎人</strong> — 被淘汰时可开枪带走一名玩家</p>
          <p><strong style="color:#3cc8b4;">🛡️ 守卫</strong> — 每晚守护一名玩家，不可连续守护同一人</p>
          <hr style="border-color:var(--border);margin:12px 0;">
          <p><strong>游戏流程：</strong></p>
          <p>夜晚 → 狼人猎杀 → 预言家查验 → 女巫用药 → 守卫守护 → 天亮 → 讨论投票 → 夜晚...</p>
          <hr style="border-color:var(--border);margin:12px 0;">
          <p><strong>胜利条件：</strong></p>
          <p style="color:var(--green);">好人阵营：消灭所有狼人</p>
          <p style="color:var(--red);">狼人阵营：存活狼人数 ≥ 存活好人数</p>
        </div>
        <button class="btn btn-primary mt-20" onclick="this.closest('.overlay').remove()" style="width:100%;">知道了</button>
      </div>
    </div>
  `;
  document.body.appendChild(div.firstElementChild);
};

/* 初始化 */
if (myName) app.showMenu(); else render();
</script>
</body>
</html>

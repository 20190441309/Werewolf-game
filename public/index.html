<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狼人杀 - 联机版</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

  :root {
    --bg-deep: #0a0a14;
    --bg-card: #141428;
    --purple: #6c3ce0;
    --purple-glow: #8b5cf6;
    --gold: #d4a843;
    --gold-glow: #f0c96d;
    --red: #e04040;
    --red-glow: #ff6b6b;
    --green: #3cb878;
    --green-glow: #5ddb9e;
    --blue: #4a90d9;
    --blue-glow: #6db3f0;
    --text: #c8c8d8;
    --text-bright: #e8e8f0;
    --text-dim: #8888a0;
    --border: #2a2a45;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'ZCOOL XiaoWei', 'PingFang SC', 'Microsoft YaHei', serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .stars-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .moon {
    position: fixed; top: 40px; right: 80px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9b0 0%, #f0c96d 30%, #c89540 70%, transparent 100%);
    box-shadow: 0 0 80px rgba(240,201,109,0.4), 0 0 160px rgba(240,201,109,0.15);
    pointer-events: none; z-index: 0;
    animation: moonGlow 4s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%,100% { box-shadow: 0 0 80px rgba(240,201,109,0.4), 0 0 160px rgba(240,201,109,0.15); }
    50% { box-shadow: 0 0 100px rgba(240,201,109,0.5), 0 0 200px rgba(240,201,109,0.2); }
  }

  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 860px;
    padding: 24px; min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .header { text-align: center; padding: 20px 0 12px; }
  .header h1 {
    font-family: 'Ma Shan Zheng', 'STKaiti', cursive;
    font-size: 52px;
    background: linear-gradient(135deg, var(--gold) 0%, #e8c870 40%, #b89330 70%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(212,168,67,0.3));
    letter-spacing: 8px; line-height: 1.2;
  }
  .header .subtitle { font-size: 14px; color: var(--text-dim); letter-spacing: 6px; margin-top: 4px; }

  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px;
    box-shadow: var(--shadow); transition: all 0.3s ease;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 28px; border: none; border-radius: 28px;
    font-family: inherit; font-size: 15px; cursor: pointer;
    transition: all 0.3s ease; letter-spacing: 2px;
    position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--purple) 0%, #7b52e0 100%);
    color: #fff; box-shadow: 0 4px 16px rgba(108,60,224,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 24px rgba(108,60,224,0.5); transform: translateY(-1px); }
  .btn-gold {
    background: linear-gradient(135deg, #b89330 0%, var(--gold) 100%);
    color: #1a1a00; font-weight: bold; box-shadow: 0 4px 16px rgba(212,168,67,0.3);
  }
  .btn-gold:hover { box-shadow: 0 6px 24px rgba(212,168,67,0.5); transform: translateY(-1px); }
  .btn-danger {
    background: linear-gradient(135deg, #c0392b 0%, var(--red) 100%);
    color: #fff; box-shadow: 0 4px 16px rgba(224,64,64,0.3);
  }
  .btn-danger:hover { box-shadow: 0 6px 24px rgba(224,64,64,0.5); transform: translateY(-1px); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text-bright); }
  .btn-sm { padding: 8px 18px; font-size: 13px; letter-spacing: 1px; }
  .btn-xs { padding: 5px 12px; font-size: 12px; border-radius: 20px; letter-spacing: 1px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .btn-lg { padding: 14px 40px; font-size: 17px; }

  .input {
    width: 100%; padding: 12px 18px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text-bright);
    font-family: inherit; font-size: 15px; outline: none; transition: all 0.3s ease;
  }
  .input:focus { border-color: var(--purple-glow); box-shadow: 0 0 0 3px rgba(108,60,224,0.1); }
  .input::placeholder { color: var(--text-dim); }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .player-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.3s ease; position: relative;
  }
  .player-chip:hover {
    background: rgba(255,255,255,0.06); border-color: var(--purple-glow);
    transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108,60,224,0.15);
  }
  .player-chip.selected {
    border-color: var(--gold); background: rgba(212,168,67,0.1);
    box-shadow: 0 0 16px rgba(212,168,67,0.2);
  }
  .player-chip.voted-by-me {
    border-color: var(--red-glow); background: rgba(224,64,64,0.12);
    box-shadow: 0 0 14px rgba(224,64,64,0.2);
  }
  .player-chip.dead {
    opacity: 0.4; pointer-events: none;
    text-decoration: line-through; text-decoration-color: var(--red);
  }
  .player-chip .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .player-chip .avatar.male { background: linear-gradient(135deg, #3a5a8c, #4a90d9); }
  .player-chip .avatar.female { background: linear-gradient(135deg, #8c3a5a, #d94a90); }
  .player-chip .info { flex: 1; min-width: 0; }
  .player-chip .name { font-size: 14px; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-chip .number { font-size: 11px; color: var(--text-dim); }

  .role-reveal { text-align: center; padding: 40px 20px; }
  .role-icon {
    width: 100px; height: 100px; border-radius: 50%;
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    font-size: 52px; animation: roleReveal 0.8s ease-out;
  }
  @keyframes roleReveal {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .role-icon.werewolf { background: linear-gradient(135deg, #4a1010, #8b2020); box-shadow: 0 0 40px rgba(224,64,64,0.4); }
  .role-icon.villager { background: linear-gradient(135deg, #2a3a2a, #3a5a3a); box-shadow: 0 0 30px rgba(60,180,120,0.2); }
  .role-icon.seer { background: linear-gradient(135deg, #1a2a4a, #2a4a8a); box-shadow: 0 0 40px rgba(74,144,217,0.4); }
  .role-icon.witch { background: linear-gradient(135deg, #3a1a4a, #6a2a8a); box-shadow: 0 0 40px rgba(160,80,220,0.4); }
  .role-icon.hunter { background: linear-gradient(135deg, #4a3a1a, #8a6a2a); box-shadow: 0 0 40px rgba(212,168,67,0.4); }
  .role-icon.guard { background: linear-gradient(135deg, #1a3a3a, #2a6a6a); box-shadow: 0 0 40px rgba(60,200,180,0.4); }
  .role-name { font-family: 'Ma Shan Zheng', 'STKaiti', cursive; font-size: 36px; margin-bottom: 8px; }
  .role-desc { font-size: 14px; color: var(--text-dim); max-width: 300px; margin: 0 auto; }

  .log-area { max-height: 200px; overflow-y: auto; padding: 4px 0; }
  .log-entry {
    padding: 8px 14px; margin: 4px 0; border-radius: 8px;
    font-size: 13px; animation: logSlide 0.4s ease-out;
  }
  @keyframes logSlide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  .log-entry.system { background: rgba(108,60,224,0.1); border-left: 3px solid var(--purple); }
  .log-entry.kill { background: rgba(224,64,64,0.1); border-left: 3px solid var(--red); }
  .log-entry.save { background: rgba(60,184,120,0.1); border-left: 3px solid var(--green); }
  .log-entry.check { background: rgba(74,144,217,0.1); border-left: 3px solid var(--blue); }
  .log-entry.vote { background: rgba(212,168,67,0.1); border-left: 3px solid var(--gold); }
  .log-entry.info { background: rgba(160,80,220,0.1); border-left: 3px solid #a050dc; }

  .phase-badge {
    display: inline-block; padding: 6px 16px; border-radius: 16px;
    font-size: 12px; letter-spacing: 2px; margin-bottom: 8px;
  }
  .phase-badge.night { background: rgba(74,80,180,0.3); color: #8b9cf5; }
  .phase-badge.day { background: rgba(212,168,67,0.2); color: var(--gold); }

  .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-20 { margin-top: 20px; }
  .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-20 { margin-bottom: 20px; }
  .text-center { text-align: center; }
  .text-dim { color: var(--text-dim); font-size: 13px; }

  .highlight-box {
    padding: 16px 20px; border-radius: var(--radius-sm);
    text-align: center; margin-bottom: 16px;
  }
  .highlight-box.danger { background: rgba(224,64,64,0.08); border: 1px solid rgba(224,64,64,0.2); }
  .highlight-box.success { background: rgba(60,184,120,0.08); border: 1px solid rgba(60,184,120,0.2); }
  .highlight-box.info { background: rgba(74,144,217,0.08); border: 1px solid rgba(74,144,217,0.2); }

  .turn-indicator {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(108,60,224,0.15); border: 1px solid rgba(108,60,224,0.3);
    margin-bottom: 16px; font-size: 14px;
  }

  .vote-summary-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    font-size: 13px;
  }
  .vote-summary-row .bar {
    height: 20px; border-radius: 10px; transition: width 0.5s ease;
    background: linear-gradient(90deg, var(--red), var(--red-glow));
    min-width: 4px;
  }

  .result-banner { text-align: center; padding: 40px 20px; }
  .result-banner .trophy { font-size: 72px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .result-banner .verdict { font-family: 'Ma Shan Zheng', 'STKaiti', cursive; font-size: 38px; margin: 12px 0; }
  .result-banner .verdict.win { color: var(--gold); }
  .result-banner .verdict.lose { color: var(--red); }

  .room-code {
    font-family: monospace;
    font-size: 28px;
    letter-spacing: 8px;
    color: var(--gold);
    background: rgba(212,168,67,0.1);
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--gold);
    display: inline-block;
    margin: 8px 0;
  }

  .chat-box {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .chat-msg { font-size: 13px; margin: 4px 0; }
  .chat-msg .sender { color: var(--red-glow); font-weight: bold; }

  .timer {
    font-size: 24px;
    color: var(--red);
    font-family: monospace;
    text-align: center;
    margin-bottom: 12px;
  }

  .tab-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .tab-btn {
    background: transparent; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 14px; cursor: pointer; padding: 6px 12px;
  }
  .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

  @media (max-width: 600px) {
    .header h1 { font-size: 36px; letter-spacing: 4px; }
    .player-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .card { padding: 16px; }
    .moon { width: 60px; height: 60px; top: 16px; right: 16px; }
  }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 12px 24px; border-radius: var(--radius-sm);
    z-index: 100; animation: toastSlide 0.3s ease;
  }
  @keyframes toastSlide { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin-left:4px; }
  .badge-host { background: var(--gold); color: #1a1a00; }
  .badge-me { background: var(--purple); color: #fff; }
  .badge-dead { background: var(--red); color: #fff; }
  .badge-sheriff { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a00; font-weight: bold; }

  /* 旁白面板 */
  .narration-panel {
    position: fixed; bottom: 20px; right: 20px;
    width: 340px; max-height: 280px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    z-index: 50; display: flex; flex-direction: column;
    transition: all 0.3s ease;
  }
  .narration-panel.collapsed { max-height: 44px; }
  .narration-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .narration-header .title { font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  .narration-header .controls { display: flex; gap: 6px; }
  .narration-header .ctrl-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 12px; padding: 2px 8px;
    font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .narration-header .ctrl-btn:hover { border-color: var(--text-dim); color: var(--text-bright); }
  .narration-header .ctrl-btn.active { border-color: var(--gold); color: var(--gold); }
  .narration-body {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    max-height: 220px;
  }
  .narration-msg {
    padding: 6px 0; font-size: 13px; color: var(--text);
    border-bottom: 1px solid rgba(255,255,255,0.03);
    animation: logSlide 0.4s ease-out;
  }
  .narration-msg.system { color: var(--text-dim); }
  .narration-msg.event { color: var(--text); background: rgba(255,255,255,0.01); }
  .narration-msg.emphasize { color: var(--gold); font-weight: 600; background: rgba(212,168,67,0.04); }
  .narration-msg.read { opacity: 0.5; }
  .narration-msg:last-child { border-bottom: none; }
  .narration-msg .narr-time {
    font-size: 11px; color: var(--text-dim); margin-right: 6px;
  }
  .narration-toggle-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 16px; padding: 4px 12px;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .narration-toggle-btn:hover { border-color: var(--gold); color: var(--gold); }
  .narration-toggle-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,168,67,0.1); }

  @media (max-width: 600px) {
    .narration-panel { width: calc(100% - 32px); right: 16px; bottom: 16px; }
  }

  /* 角色配置 */
  .role-config-section { margin-top: 16px; }
  .role-config-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .role-config-header .label { font-size: 14px; color: var(--text-bright); }
  .preset-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .preset-btn {
    padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-size: 12px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .preset-btn:hover { border-color: var(--purple-glow); color: var(--text-bright); }
  .preset-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,168,67,0.1); }
  .role-editor { display: flex; flex-direction: column; gap: 8px; }
  .role-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: rgba(255,255,255,0.02);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .role-row .role-icon-sm { font-size: 20px; width: 28px; text-align: center; }
  .role-row .role-label { flex: 1; font-size: 13px; color: var(--text-bright); }
  .role-row .role-team { font-size: 11px; padding: 1px 6px; border-radius: 8px; }
  .role-row .role-team.wolf { background: rgba(224,64,64,0.2); color: var(--red-glow); }
  .role-row .role-team.good { background: rgba(60,184,120,0.2); color: var(--green-glow); }
  .role-row .counter {
    display: flex; align-items: center; gap: 8px;
  }
  .role-row .counter button {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-bright); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .role-row .counter button:hover { border-color: var(--purple-glow); background: rgba(108,60,224,0.15); }
  .role-row .counter .count {
    font-size: 16px; font-weight: bold; color: var(--gold);
    width: 24px; text-align: center;
  }
  .role-config-summary {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
  }
  .role-config-summary .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 12px; font-size: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  }
  .config-status {
    margin-top: 8px; padding: 8px 12px; border-radius: var(--radius-sm);
    font-size: 12px; text-align: center;
  }
  .config-status.error { background: rgba(224,64,64,0.1); color: var(--red-glow); border: 1px solid rgba(224,64,64,0.2); }
  .config-status.ok { background: rgba(60,184,120,0.1); color: var(--green-glow); border: 1px solid rgba(60,184,120,0.2); }

  /* 表情/互动系统 */
  .emotion-panel {
    position: fixed; bottom: 20px; left: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    z-index: 50; padding: 12px;
    max-width: 280px;
  }
  .emotion-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .emotion-toggle-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 16px; padding: 6px 14px;
    font-size: 13px; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .emotion-toggle-btn:hover { border-color: var(--purple-glow); color: var(--text-bright); }
  .emotion-mute-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 50%; width: 32px; height: 32px;
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .emotion-mute-btn:hover { border-color: var(--text-dim); color: var(--text-bright); }
  .emotion-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 8px;
  }
  .emotion-btn {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px;
    font-size: 24px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .emotion-btn:hover {
    background: rgba(108,60,224,0.15); border-color: var(--purple-glow);
    transform: scale(1.1);
  }
  .quick-msg-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .quick-msg-btn {

<script>
/* ========== 星空背景 ========== */
const canvas = document.getElementById('starsCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 2000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.5, twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
    });
  }
}
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    s.twinkle += s.speed;
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.35 + 0.35;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,255,${alpha})`; ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
initStars(); drawStars();

/* ========== 音效系统 ========== */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

const SoundManager = {
  muted: false,
  volume: 0.5,

  playTone(freq, duration, type = 'sine', vol = 0.06) {
    if (this.muted) return;
    try {
      const ac = getAudioCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      const v = vol * this.volume;
      gain.gain.setValueAtTime(v, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + duration);
    } catch(e) {}
  },

  playSequence(notes) {
    if (this.muted) return;
    let delay = 0;
    notes.forEach(([freq, dur, type, vol]) => {
      setTimeout(() => this.playTone(freq, dur, type, vol), delay);
      delay += dur * 1000 * 0.8;
    });
  },

  // 场景音效
  nightFall() {
    this.playSequence([
      [220, 0.4, 'sine', 0.08],
      [196, 0.3, 'sine', 0.06],
      [165, 0.6, 'sine', 0.1],
    ]);
  },

  dayBreak() {

function generateQRCode(text) {
  const canvas = document.getElementById('qrCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = 160;
  const cellSize = 4;
  const modules = Math.floor(size / cellSize);

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);

  // 简单的QR码生成（伪随机点阵）
  ctx.fillStyle = '#000';
  const hash = simpleHash(text);
  for (let i = 0; i < modules; i++) {
    for (let j = 0; j < modules; j++) {
      // 边框定位点
      if (i < 7 && j < 7) {
        if (i === 0 || i === 6 || j === 0 || j === 6 ||
            (i >= 2 && i <= 4 && j >= 2 && j <= 4)) {
          ctx.fillRect(i * cellSize, j * cellSize, cellSize, cellSize);
          continue;
        }
      }
      if (i >= modules - 7 && j < 7) {
        if (i === modules - 7 || i === modules - 1 || j === 0 || j === 6 ||
            (i >= modules - 5 && i <= modules - 3 && j >= 2 && j <= 4)) {
          ctx.fillRect(i * cellSize, j * cellSize, cellSize, cellSize);
          continue;
        }
      }
      if (i < 7 && j >= modules - 7) {
        if (i === 0 || i === 6 || j === modules - 7 || j === modules - 1 ||
            (i >= 2 && i <= 4 && j >= modules - 5 && j <= modules - 3)) {
          ctx.fillRect(i * cellSize, j * cellSize, cellSize, cellSize);
          continue;
        }
      }
      // 数据区域
      if ((hash * (i * modules + j + 1)) % 3 === 0) {
        ctx.fillRect(i * cellSize, j * cellSize, cellSize, cellSize);
      }
    }
  }
}

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板');
  }).catch(() => {
    const input = document.createElement('input');
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('已复制到剪贴板');
  });
}

// 检查URL参数，自动加入房间
function checkUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room');
  const pwd = params.get('pwd');

  if (roomId && myName) {
    // 自动尝试加入房间
    socket.emit('join-room', roomId, myName, pwd || null, (res) => {
      if (res.success) {
        showToast('已通过邀请链接加入房间');
      } else {
        showToast(res.error || '加入失败');
        // 清除URL参数
        window.history.replaceState({}, '', window.location.pathname);
      }
    });
  } else if (roomId && !myName) {
    // 需要先设置昵称
    showToast('请先设置昵称，然后自动加入房间');
    localStorage.setItem('ww_pendingRoom', roomId);
    if (pwd) localStorage.setItem('ww_pendingPwd', pwd);
  }
}

/* ========== 战绩系统 ========== */
const StatsManager = {
  KEY: 'ww_stats',

  getStats() {
    const data = localStorage.getItem(this.KEY);
    if (!data) return this.getDefaultStats();
    try {
      return JSON.parse(data);
    } catch {
      return this.getDefaultStats();
    }
  },

  getDefaultStats() {
    return {
      totalGames: 0,
      wins: 0,
      losses: 0,
      roleStats: {},
      maxWinStreak: 0,
      currentWinStreak: 0,
      totalRounds: 0,
    };
  },

  saveStats(stats) {
    localStorage.setItem(this.KEY, JSON.stringify(stats));
  },

  recordGame(winner, myRole, rounds) {
    const stats = this.getStats();
    const isWin = (winner === 'villager' && myRole !== 'werewolf') ||
                  (winner === 'werewolf' && myRole === 'werewolf');

    stats.totalGames++;
    stats.totalRounds += rounds;

    if (isWin) {
      stats.wins++;
      stats.currentWinStreak++;
      if (stats.currentWinStreak > stats.maxWinStreak) {
        stats.maxWinStreak = stats.currentWinStreak;
      }
    } else {
      stats.losses++;
      stats.currentWinStreak = 0;
    }

    if (!stats.roleStats[myRole]) {
      stats.roleStats[myRole] = { games: 0, wins: 0 };
    }
    stats.roleStats[myRole].games++;
    if (isWin) stats.roleStats[myRole].wins++;

    this.saveStats(stats);
  },

  getWinRate() {
    const stats = this.getStats();
    if (stats.totalGames === 0) return 0;
    return Math.round((stats.wins / stats.totalGames) * 100);
  },

  getRoleWinRate(role) {
    const stats = this.getStats();
    const roleStat = stats.roleStats[role];
    if (!roleStat || roleStat.games === 0) return 0;
    return Math.round((roleStat.wins / roleStat.games) * 100);
  },
};

};

function getDefaultConfigForCount(count) {
  // 与服务端 getRoleConfig 一致
  if (count === 6)  return { werewolf: 2, villager: 2, seer: 1, witch: 1 };
  if (count === 7)  return { werewolf: 2, villager: 2, seer: 1, witch: 1, hunter: 1 };
  if (count === 8)  return { werewolf: 2, villager: 2, seer: 1, witch: 1, hunter: 1, guard: 1 };
  if (count === 9)  return { werewolf: 3, villager: 2, seer: 1, witch: 1, hunter: 1, guard: 1 };
  if (count === 10) return { werewolf: 3, villager: 3, seer: 1, witch: 1, hunter: 1, guard: 1 };
  if (count === 11) return { werewolf: 3, villager: 3, seer: 1, witch: 1, hunter: 1, guard: 1 };
  return { werewolf: 4, villager: 3, seer: 1, witch: 1, hunter: 1, guard: 1 };
}

function getPresetConfig(preset, count) {
  if (preset === 'standard') return getDefaultConfigForCount(count);
  if (preset === 'all-roles') {
    const specials = { seer: 1, witch: 1, hunter: 1, guard: 1, idiot: 1, elder: 1, cupid: 1 };
    const specialCount = 7;
    const wolves = Math.max(1, Math.floor(count * 0.25));
    const villagers = count - wolves - specialCount;
    return { werewolf: wolves, ...specials, villager: Math.max(1, villagers) };
  }
  if (preset === 'newbie') {
    const wolves = Math.max(1, Math.floor(count / 4));
    const specials = { seer: 1 };
    if (count >= 7) specials.witch = 1;
    const specialCount = Object.values(specials).reduce((a,b)=>a+b, 0);
    return { werewolf: wolves, ...specials, villager: count - wolves - specialCount };
  }
  return getDefaultConfigForCount(count);
}

function validateClientConfig(config, playerCount) {
  if (!config) return { valid: false, error: '请配置角色' };
  let total = 0, wolves = 0, good = 0;
  for (const [role, num] of Object.entries(config)) {
    if (!ROLES[role]) return { valid: false, error: `未知角色: ${role}` };
    if (num < 0) return { valid: false, error: '数量不能为负' };
    total += num;
    if (role === 'werewolf') wolves += num; else good += num;
  }
  if (wolves < 1) return { valid: false, error: '至少需要1名狼人' };
  if (good < 1) return { valid: false, error: '至少需要1名好人' };
  if (total !== playerCount) return { valid: false, error: `角色总数(${total})与玩家数(${playerCount})不匹配` };
  return { valid: true };
}

socket.on('state', (s) => {
  const prevPhase = state ? state.phase : null;
  if (s.phase === 'lobby' || s.phase === 'role-reveal') wwChatHistory = [];
  if (s.phase === 'last-words') lastWordsChatHistory = [];
  state = s;

  // 阶段切换音效
  if (prevPhase !== s.phase) {
    switch (s.phase) {
      case 'night-werewolf':
        SoundManager.nightFall(); break;
      case 'day':
        SoundManager.dayBreak(); break;
      case 'vote':
        SoundManager.voteStart(); break;
      case 'tally':
        SoundManager.voteEnd(); break;
      case 'last-words':
        SoundManager.playerDeath(); break;
      case 'hunter-shoot':
        SoundManager.hunterShoot(); break;
      case 'sheriff-nominate':
        SoundManager.voteStart(); break;
      case 'sheriff-vote':
        SoundManager.voteStart(); break;
      case 'gameover':
        if (s.winner === 'villager') SoundManager.gameWin();
        else SoundManager.gameLose();
        // 记录战绩
        if (personal && personal.myRole) {
          StatsManager.recordGame(s.winner, personal.myRole, s.round);
        }
        break;
    }
  }

  render();
});

  wwChatHistory.push(msg);

});

function render() {
  // 移除旧旁白面板和音效控制
  const oldPanel = document.getElementById('narrationPanel');
  if (oldPanel) oldPanel.remove();
  const oldSound = document.getElementById('soundControl');
  if (oldSound) oldSound.remove();

  // 添加音效控制
  document.body.insertAdjacentHTML('beforeend', renderSoundControl());

  if (!state) {
    app.innerHTML = renderLobby();
    return;
  }

  switch (state.phase) {
    case 'lobby': app.innerHTML = renderLobby(); break;
    case 'role-reveal': app.innerHTML = renderRoleReveal(); break;
    case 'night-werewolf':
    case 'night-seer':
    case 'night-witch':
    case 'night-guard': app.innerHTML = renderNight(); break;
    case 'hunter-shoot': app.innerHTML = renderHunterShoot(); break;
    case 'day': app.innerHTML = renderDay(); break;
    case 'vote': app.innerHTML = renderVote(); break;
    case 'tally': app.innerHTML = renderTally(); break;
    case 'last-words': app.innerHTML = renderLastWords(); break;
    case 'sheriff-nominate': app.innerHTML = renderSheriffNominate(); break;
    case 'sheriff-speak': app.innerHTML = renderSheriffSpeak(); break;
    case 'sheriff-vote': app.innerHTML = renderSheriffVote(); break;
    case 'sheriff-transfer': app.innerHTML = renderSheriffTransfer(); break;
    case 'gameover': app.innerHTML = renderGameOver(); break;
    default: app.innerHTML = renderLobby();

  // 游戏进行中显示旁白面板
  if (state.phase !== 'lobby') {
    document.body.insertAdjacentHTML('beforeend', renderNarrationPanel());
  }

  // 游戏进行中显示表情面板
  if (state.phase !== 'lobby' && state.phase !== 'role-reveal') {
    document.body.insertAdjacentHTML('beforeend', renderEmotionPanel());

}

/* 旁白面板 */
function renderNarrationPanel() {
  if (!state || state.phase === 'lobby') return '';
  const msgs = narrationHistory.slice(-20);
  const timeStr = (t) => {
    const d = new Date(t);
    const hhmm = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    let prefix = '';
    try {
      if (state && state.phase && state.round) {
        if (String(state.phase).startsWith('night')) prefix = `夜${state.round}`;
        else if (state.phase === 'day') prefix = `天${state.round}`;
      }
    } catch (e) {}
    return `${prefix ? prefix + ' ' : ''}${hhmm}`;
  };
  return `
    <div class="narration-panel ${narrationCollapsed ? 'collapsed' : ''}" id="narrationPanel">
      <div class="narration-header" onclick="toggleNarrationCollapse()">
        <span class="title">📜 旁白</span>
        <div class="controls">
          <button class="ctrl-btn" onclick="event.stopPropagation();markNarrationRead()" title="标为已读">✓</button>
          <button class="ctrl-btn" onclick="event.stopPropagation();clearNarration()" title="清空旁白">🗑️</button>
          <button class="ctrl-btn ${narrationTtsEnabled ? 'active' : ''}" onclick="event.stopPropagation();toggleNarrationTts()" title="语音播报">
            ${narrationTtsEnabled ? '🔊' : '🔇'}
          </button>
          <button class="ctrl-btn" onclick="event.stopPropagation();toggleNarrationCollapse()">
            ${narrationCollapsed ? '展开' : '收起'}
          </button>
        </div>
      </div>
      ${narrationCollapsed ? '' : `
        <div class="narration-body" id="narrationBody">
          ${msgs.map(m => {
            const cls = (m.type && ['system','event','emphasize'].includes(m.type)) ? m.type : (/游戏开始|天亮|获胜|被放逐|猎人临死前/.test(m.msg) ? 'emphasize' : (/投票|女巫|预言家|守卫|狼人/.test(m.msg) ? 'event' : 'system'));
            return `
            <div class="narration-msg ${cls}">
              <span class="narr-time">${timeStr(m.time)}</span>${escapeHtml(m.msg)}
            </div>
          `
          }).join('')}
          ${msgs.length === 0 ? '<div class="text-dim" style="text-align:center;padding:20px;">等待旁白...</div>' : ''}
        </div>
      `}
    </div>
  `;
}

function addNarrationMsg(data) {
  const body = document.getElementById('narrationBody');
  if (!body) {
    // 面板未渲染，需要重新render
    const existing = document.getElementById('narrationPanel');
    if (!existing && state && state.phase !== 'lobby') {
      document.body.insertAdjacentHTML('beforeend', renderNarrationPanel());
    }
    return;
  }
  // 移除空状态提示
  const emptyHint = body.querySelector('.text-dim');
  if (emptyHint) emptyHint.remove();
  const d = new Date(data.time);
  const hhmm = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  let prefix = '';
  try {
    if (state && state.phase && state.round) {
      if (String(state.phase).startsWith('night')) prefix = `夜${state.round}`;
      else if (state.phase === 'day') prefix = `天${state.round}`;
    }
  } catch (e) {}
  const ts = `${prefix ? prefix + ' ' : ''}${hhmm}`;
  const cls = (data.type && ['system','event','emphasize'].includes(data.type)) ? data.type : (/游戏开始|天亮|获胜|被放逐|猎人临死前/.test(data.msg) ? 'emphasize' : (/投票|女巫|预言家|守卫|狼人/.test(data.msg) ? 'event' : 'system'));
  const div = document.createElement('div');
  div.className = `narration-msg ${cls}`;
  div.innerHTML = `<span class="narr-time">${ts}</span>${escapeHtml(data.msg)}`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function markNarrationRead() {
  const body = document.getElementById('narrationBody');
  if (!body) return;
  const msgs = body.querySelectorAll('.narration-msg');
  msgs.forEach(m => m.classList.add('read'));
  showToast('旁白已标为已读');
}

function clearNarration() {
  narrationHistory = [];
  const body = document.getElementById('narrationBody');
  if (body) {
    body.innerHTML = '<div class="text-dim" style="text-align:center;padding:20px;">等待旁白...</div>';
  }
  showToast('旁白已清空');
}

function toggleNarrationCollapse() {
  narrationCollapsed = !narrationCollapsed;
  const panel = document.getElementById('narrationPanel');
  if (panel) {
    panel.outerHTML = renderNarrationPanel();
  }
}

function toggleNarrationTts() {
  narrationTtsEnabled = !narrationTtsEnabled;
  showToast(narrationTtsEnabled ? '语音播报已开启' : '语音播报已关闭');
  const panel = document.getElementById('narrationPanel');
  if (panel) {
    panel.outerHTML = renderNarrationPanel();
  }
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 1.0;
  utter.volume = 0.8;
  window.speechSynthesis.speak(utter);
}

/* ========== 投票 ========== */
function renderVote() {
  const alive = state.players.filter(p => p.alive && !p.disconnected);

  return `

function updateVoteTimer(ms) {
  const el = document.getElementById('voteTimer');
  if (el) el.textContent = formatTime(ms);
}

function formatTime(ms) {
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

        <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">已报名竞选 (${candidates.length}人)</div>
        <div class="player-grid mb-20">
          ${candidates.map(p => `
            <div class="player-chip">
              <div class="avatar ${p.gender}">⭐</div>
              <div class="info">
                <div class="name">${escapeHtml(p.name)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}

      <div class="flex-row" style="justify-content:center;gap:12px;">
        ${!nominated ? `
          <button class="btn btn-primary" onclick="app.nominateSheriff()">⭐ 我要竞选</button>
        ` : `
          <button class="btn btn-ghost" disabled>已报名</button>
        `}
        ${isHost ? `
          <button class="btn btn-gold" onclick="app.endNomination()">确认名单</button>
          <button class="btn btn-ghost" onclick="app.skipSheriffElection()">跳过选举</button>
        ` : ''}
      </div>
      ${!isHost ? '<div class="text-center text-dim mt-12">等待房主确认...</div>' : ''}
    </div>
  `;
}

function renderSheriffSpeak() {
  const currentId = state.sheriffCandidates[state.sheriffSpeakIdx];
  const current = state.players.find(p => p.socketId === currentId);
  const isMyTurn = personal?.mySocketId === currentId;
  const isCandidate = state.sheriffCandidates.includes(personal?.mySocketId);

  return `
    <div class="header">
      <span class="phase-badge day">☀️ 白天 · 第 ${state.round} 天</span>
      <h1 style="font-size:28px;">⭐ 竞选演讲</h1>
      <div class="subtitle">${state.sheriffSpeakIdx + 1} / ${state.sheriffCandidates.length}</div>
    </div>

    <div class="card mb-20">
      <div class="text-center mb-16">
        <div style="font-size:36px;margin-bottom:8px;">🎤</div>
        <div style="font-size:18px;color:var(--text-bright);margin-bottom:4px;">
          ${current ? escapeHtml(current.name) : '玩家'} 正在发言
        </div>
        <div class="sheriff-timer timer" style="font-size:24px;">${formatTime(sheriffSpeakTimeLeft)}</div>
      </div>

      ${isMyTurn ? `
        <div class="highlight-box info mb-16">
          <div style="color:var(--gold);">轮到你发言了！请向大家说明你适合当警长的理由。</div>
        </div>
      ` : isCandidate ? `
        <div class="text-center text-dim">等待其他竞选者发言...</div>
      ` : ''}

      <div class="player-grid mb-20">
        ${state.sheriffCandidates.map((id, idx) => {
          const p = state.players.find(pl => pl.socketId === id);
          if (!p) return '';
          const isCurrent = idx === state.sheriffSpeakIdx;
          return `
            <div class="player-chip ${isCurrent ? 'active' : ''}" style="${isCurrent ? 'border-color:var(--gold);' : ''}">
              <div class="avatar ${p.gender}">⭐</div>
              <div class="info">
                <div class="name">${escapeHtml(p.name)} ${isCurrent ? '🎤' : ''}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderSheriffVote() {
  const isCandidate = state.sheriffCandidates.includes(personal?.mySocketId);
  const myVote = state.sheriffVotes[personal?.mySocketId];
  const candidates = state.sheriffCandidates.map(id => state.players.find(p => p.socketId === id)).filter(Boolean);
  const canVote = personal?.myAlive && !isCandidate;

  return `
    <div class="header">
      <span class="phase-badge day">☀️ 白天 · 第 ${state.round} 天</span>
      <h1 style="font-size:28px;">⭐ 投票选举警长</h1>
      <div class="subtitle">选择你支持的竞选者</div>
    </div>

    <div class="card mb-20">
      <div class="text-center mb-16">
        <div style="font-size:36px;margin-bottom:8px;">🗳️</div>
        <div style="font-size:16px;color:var(--text-bright);">
          ${canVote ? '请投票选择警长' : isCandidate ? '你是竞选者，无法投票' : '你已出局，无法投票'}
        </div>
      </div>

      <div class="player-grid mb-20">
        ${candidates.map(p => renderPlayerChip(p, {
          selectable: canVote && !myVote,

function renderSheriffTransfer() {
  const alive = state.players.filter(p => p.alive && !p.disconnected);
  const isDeadSheriff = personal?.mySocketId === state.hunterPending || !personal?.myAlive;

  return `
    <div class="header">
      <h1 style="font-size:28px;">⭐ 警徽处理</h1>
      <div class="subtitle">警长已死亡，需要处理警徽</div>
    </div>

    <div class="card mb-20">
      <div class="text-center mb-16">
        <div style="font-size:36px;margin-bottom:8px;">⭐</div>
        <div style="font-size:16px;color:var(--text-bright);">
          请选择将警徽移交给其他玩家，或撕毁警徽
        </div>
      </div>

      <div class="player-grid mb-20">

          ${isVillagerWin ? '好人阵营获胜！' : '狼人阵营获胜！'}
        </div>
        <div style="color:var(--text-dim);margin-bottom:8px;">
          ${isVillagerWin ? '所有狼人已被消灭，村庄恢复和平 🕊️' : '狼人占领了村庄...黑暗降临 🌑'}
        </div>
        <div class="text-dim">共进行 ${state.round} 轮</div>
      </div>

      <div style="text-align:left;">
        <div style="font-size:14px;color:var(--text-bright);margin-bottom:12px;">身份揭晓：</div>

          const role = ROLES[p.role];
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:6px 0;${!p.alive ? 'opacity:0.5;' : ''}">
              <span style="font-size:20px;">${role.icon}</span>
              <span style="color:var(--text-bright);flex:1;">${escapeHtml(p.name)}</span>
              <span style="color:${role.color};font-size:13px;">${role.name}</span>

/* ========== 公共组件 ========== */
function renderPlayerChip(p, opts = {}) {
  const { selectable, selected, votedByMe, onClick } = opts;
  const cls = [
    'player-chip',
    !p.alive ? 'dead' : '',
    selected ? 'selected' : '',
    votedByMe ? 'voted-by-me' : '',
  ].filter(Boolean).join(' ');

  const avatarCls = `avatar ${p.gender}`;
  const emoji = p.role && (!p.alive || state.phase === 'gameover') ? ROLES[p.role].icon : (p.gender === 'male' ? '👤' : '👤');

  const onclick = onClick ? `onclick="${onClick}"` : '';

  return `
    <div class="${cls}" data-id="${p.socketId}" ${onclick}>
      <div class="${avatarCls}">${emoji}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)} ${p.socketId === state.hostSocketId ? '<span class="badge badge-host">房主</span>' : ''} ${p.socketId === personal?.mySocketId ? '<span class="badge badge-me">我</span>' : ''} ${p.socketId === state.sheriffId ? '<span class="badge badge-sheriff">⭐警长</span>' : ''} ${!p.alive ? '💀' : ''}</div>
        <div class="number">${p.role && (!p.alive || state.phase === 'gameover') ? ROLES[p.role].name : '存活'}</div>
      </div>
    </div>
  `;
}

function renderLogs() {
  return `
    <div class="card">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">游戏记录</div>
      <div class="log-area">
        ${(state.logs || []).map(l => `<div class="log-entry ${l.type}">${escapeHtml(l.msg)}</div>`).join('')}
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
}

/* ========== 操作 ========== */
app.setName = function() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) return showToast('请输入昵称');
  myName = name;
  localStorage.setItem('ww_name', name);

  // 检查是否有待加入的房间
  const pendingRoom = localStorage.getItem('ww_pendingRoom');
  const pendingPwd = localStorage.getItem('ww_pendingPwd');
  if (pendingRoom) {
    localStorage.removeItem('ww_pendingRoom');
    localStorage.removeItem('ww_pendingPwd');
    socket.emit('join-room', pendingRoom, myName, pendingPwd || null, (res) => {
      if (res.success) {
        showToast('已通过邀请链接加入房间');
      } else {
        showToast(res.error || '加入失败');
        app.showMenu();
      }
    });
  } else {
    app.showMenu();
  }
};

app.showMenu = function() {
  state = null;
  app.innerHTML = `
    <div class="header">
      <h1>狼 人 杀</h1>
      <div class="subtitle">欢迎，${escapeHtml(myName)}</div>

          onkeydown="if(event.key==='Enter')app.joinRoom()">

        <button class="btn btn-ghost" onclick="app.spectateRoom()">👁️ 观战</button>

function renderReplayModal(replay) {
  if (document.querySelector('.overlay.replay-overlay')) return;

  const events = replay.replayData || [];
  const duration = replay.duration || 0;
  const minutes = Math.floor(duration / 60000);
  const seconds = Math.floor((duration % 60000) / 1000);

  const eventsHtml = events.map((e, idx) => {
    const time = (e.time / 1000).toFixed(1);
    let icon = '📌';
    let desc = '';

    switch (e.event) {
      case 'game-start':
        icon = '🎮';
        desc = `游戏开始，${e.data.players.length} 名玩家`;
        break;
      case 'werewolf-kill':
        icon = '🐺';
        desc = `狼人选择猎杀 ${e.data.target}`;
        break;
      case 'seer-check':
        icon = '🔮';
        desc = `预言家查验 ${e.data.target}，结果：${e.data.result === 'werewolf' ? '狼人' : '好人'}`;
        break;
      case 'witch-action':
        icon = '🧪';
        desc = `女巫${e.data.save ? '使用解药' : ''}${e.data.save && e.data.poison ? '，' : ''}${e.data.poison ? '使用毒药' : '未使用药水'}`;
        break;
      case 'guard-action':
        icon = '🛡️';
        desc = e.data.target ? `守卫守护 ${e.data.target}` : '守卫未守护';
        break;
      case 'night-result':
        icon = '🌙';
        desc = e.data.killed.length > 0 ? `夜晚结果：${e.data.killed.join('、')} 死亡` : '平安夜';
        break;
      case 'vote-result':
        icon = '🗳️';
        desc = e.data.eliminated ? `投票结果：${e.data.eliminated} 被放逐` : '平票，无人被放逐';
        break;
      case 'game-over':
        icon = '🏆';
        desc = `游戏结束：${e.data.winner === 'villager' ? '好人阵营' : '狼人阵营'}获胜`;
        break;
      default:
        icon = '📌';
        desc = e.event;
    }

    return `
      <div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="color:var(--text-dim);font-size:12px;min-width:50px;">${time}s</span>
        <span style="font-size:16px;">${icon}</span>
        <span style="color:var(--text-bright);flex:1;">${desc}</span>
      </div>
    `;
  }).join('');

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="overlay replay-overlay" onclick="this.remove()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:600px;max-height:80vh;overflow-y:auto;">
        <h2 style="text-align:center;">📹 游戏回放</h2>
        <div style="display:flex;justify-content:space-around;margin-bottom:16px;">
          <div class="text-center">
            <div style="font-size:20px;font-weight:bold;color:var(--gold);">${replay.rounds || 0}</div>
            <div style="color:var(--text-dim);font-size:12px;">总轮数</div>
          </div>
          <div class="text-center">
            <div style="font-size:20px;font-weight:bold;color:var(--blue);">${minutes}:${seconds.toString().padStart(2, '0')}</div>
            <div style="color:var(--text-dim);font-size:12px;">游戏时长</div>
          </div>
          <div class="text-center">
            <div style="font-size:20px;font-weight:bold;color:${replay.winner === 'villager' ? 'var(--green)' : 'var(--red)'};">${replay.winner === 'villager' ? '好人胜' : '狼人胜'}</div>
            <div style="color:var(--text-dim);font-size:12px;">结果</div>
          </div>
        </div>

        <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">玩家身份</div>
        <div class="card mb-16" style="padding:12px;">
          ${replay.players.map(p => {
            const role = ROLES[p.role];
            return `
              <div style="display:flex;align-items:center;gap:8px;padding:4px 0;">
                <span style="font-size:16px;">${role?.icon || '❓'}</span>
                <span style="color:var(--text-bright);flex:1;">${escapeHtml(p.name)}</span>
                <span style="color:${role?.color || 'var(--text)'};font-size:12px;">${role?.name || p.role}</span>
                ${!p.alive ? '<span style="color:var(--red);font-size:12px;">💀</span>' : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">事件时间线</div>
        <div class="card" style="padding:12px;">
          ${eventsHtml || '<div class="text-dim">暂无回放数据</div>'}
        </div>

        <button class="btn btn-primary mt-20" onclick="this.closest('.overlay').remove()" style="width:100%;">关闭</button>
      </div>
    </div>
  `;
  document.body.appendChild(div.firstElementChild);
}

app.toggleNarration = function() {
  socket.emit('toggle-narration');
};

app.selectPreset = function(preset) {
  selectedPreset = preset;
  customRoleConfig = null;
  // 如果是标准局，重置服务端配置
  if (preset === 'standard') {
    socket.emit('reset-role-config');
  } else {
    const config = getPresetConfig(preset, state.players.length);
    socket.emit('set-role-config', config, (res) => {
      if (!res.success) showToast(res.error);
    });
  }
  render();
};

app.enterCustomConfig = function() {
  const count = state.players.length;
  customRoleConfig = { ...(state.roleConfig || getPresetConfig(selectedPreset, count)) };
  render();
};

app.adjustRole = function(role, delta) {
  if (!customRoleConfig) return;
  const newVal = (customRoleConfig[role] || 0) + delta;
  if (newVal < 0) return;
  if (newVal === 0) delete customRoleConfig[role];
  else customRoleConfig[role] = newVal;
  render();
};

app.applyRoleConfig = function() {
  if (!customRoleConfig) return;
  const validation = validateClientConfig(customRoleConfig, state.players.length);
  if (!validation.valid) return showToast(validation.error);
  socket.emit('set-role-config', customRoleConfig, (res) => {
    if (res.success) {
      showToast('角色配置已应用');
      selectedPreset = 'custom';
      customRoleConfig = null;
      render();
    } else {
      showToast(res.error || '配置失败');
    }
  });
};

app.resetRoleConfig = function() {
  customRoleConfig = null;
  selectedPreset = 'standard';
  socket.emit('reset-role-config');
};

app.showStats = function() {
  if (document.querySelector('.overlay.stats-overlay')) return;

  const stats = StatsManager.getStats();
  const winRate = StatsManager.getWinRate();
  const avgRounds = stats.totalGames > 0 ? Math.round(stats.totalRounds / stats.totalGames) : 0;

  const roleStatsHtml = Object.entries(stats.roleStats).map(([role, data]) => {
    const roleInfo = ROLES[role];
    if (!roleInfo) return '';
    const rate = data.games > 0 ? Math.round((data.wins / data.games) * 100) : 0;
    return `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:18px;">${roleInfo.icon}</span>
        <span style="flex:1;color:var(--text-bright);">${roleInfo.name}</span>
        <span style="color:var(--text-dim);font-size:12px;">${data.games}场</span>
        <span style="color:${rate >= 50 ? 'var(--green)' : 'var(--red)'};font-weight:bold;">${rate}%</span>
      </div>
    `;
  }).join('');

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="overlay stats-overlay" onclick="this.remove()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:400px;">
        <h2 style="text-align:center;">📊 战绩统计</h2>
        <div class="mb-16" style="text-align:center;">
          <div style="font-size:36px;font-weight:bold;color:var(--gold);">${winRate}%</div>
          <div style="color:var(--text-dim);">总胜率</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;">
          <div class="card" style="text-align:center;padding:12px;">
            <div style="font-size:20px;font-weight:bold;color:var(--text-bright);">${stats.totalGames}</div>
            <div style="color:var(--text-dim);font-size:12px;">总场次</div>
          </div>
          <div class="card" style="text-align:center;padding:12px;">
            <div style="font-size:20px;font-weight:bold;color:var(--green);">${stats.wins}</div>
            <div style="color:var(--text-dim);font-size:12px;">胜利</div>
          </div>
          <div class="card" style="text-align:center;padding:12px;">
            <div style="font-size:20px;font-weight:bold;color:var(--red);">${stats.losses}</div>
            <div style="color:var(--text-dim);font-size:12px;">失败</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;">
          <div class="card" style="text-align:center;padding:12px;">
            <div style="font-size:20px;font-weight:bold;color:var(--purple-glow);">${stats.maxWinStreak}</div>
            <div style="color:var(--text-dim);font-size:12px;">最高连胜</div>
          </div>
          <div class="card" style="text-align:center;padding:12px;">
            <div style="font-size:20px;font-weight:bold;color:var(--blue);">${avgRounds}</div>
            <div style="color:var(--text-dim);font-size:12px;">平均轮数</div>
          </div>
        </div>
        ${roleStatsHtml ? `
          <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">角色胜率</div>
          <div class="card" style="padding:12px;">
            ${roleStatsHtml}
          </div>
        ` : ''}
        <button class="btn btn-primary mt-20" onclick="this.closest('.overlay').remove()" style="width:100%;">关闭</button>
      </div>
    </div>
  `;
  document.body.appendChild(div.firstElementChild);
};
